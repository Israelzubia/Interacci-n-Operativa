<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interacción Operativa</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1c1f24; --muted: #6b7280; --line: #e5e7eb; --accent: #128c7e; --danger: #b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171a; --card: #1e2226; --text: #eceff1; --muted: #9aa4ad; --line: #2c3238; --accent: #25d366; --danger: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .qr { display: block; margin: 12px auto; width: 260px; max-width: 100%; background: #fff; padding: 8px; border-radius: 8px; }
    button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    button.danger { color: var(--danger); }
    input { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: .85rem; }
    td.num, th.num { text-align: right; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    .dot.on { background: var(--accent); }
    .sec { margin: 20px 0 6px; font-size: .95rem; }
    details { border-bottom: 1px solid var(--line); }
    summary { cursor: pointer; padding: 9px 4px; display: flex; justify-content: space-between; gap: 12px; }
    summary .meta { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .msgs { max-height: 340px; overflow-y: auto; padding: 4px 4px 12px; }
    .msg { margin: 6px 0; }
    .msg .who { font-weight: 600; font-size: .85rem; }
    .msg .when { color: var(--muted); font-size: .75rem; margin-left: 6px; }
    .msg .txt { white-space: pre-wrap; word-break: break-word; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
    .tabs + .tabs { margin-top: 8px; }
    .tabs button { padding: 5px 12px; border-radius: 999px; font-size: .9rem; }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Interacción Operativa · Grupos de WhatsApp</h1>

  <section class="card">
    <div class="row">
      <div><span class="dot" id="dot"></span><strong id="statusText">Cargando…</strong></div>
      <button class="danger" id="logoutBtn" hidden>Desconectar</button>
      <button id="connectBtn" hidden>Conectar</button>
    </div>
    <div id="qrBox" hidden>
      <p class="muted">En tu teléfono: WhatsApp → Dispositivos vinculados → Vincular un dispositivo, y escanea este código.</p>
      <img class="qr" id="qr" alt="Código QR para vincular WhatsApp">
    </div>
  </section>

  <section class="card" id="groupsCard" hidden>
    <div class="row">
      <strong id="groupsTitle">Grupos</strong>
      <button id="refreshBtn">Actualizar</button>
    </div>
    <div class="tabs" id="typeTabs"></div>
    <div class="tabs" id="clientTabs"></div>
    <input id="filter" type="search" placeholder="Buscar grupo…" style="margin-top:12px">
    <h3 class="sec" id="withTitle"></h3>
    <div id="withList"></div>
    <h3 class="sec" id="withoutTitle"></h3>
    <div id="withoutList"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
